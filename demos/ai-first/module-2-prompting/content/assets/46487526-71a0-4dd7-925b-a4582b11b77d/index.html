<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Красивый дом</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'StratosSkyeng', 'Inter', sans-serif;
    background: #f9f9f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .main-title {
    font-size: 32px;
    font-weight: 700;
    color: #1a1a1a;
    text-align: center;
    margin-bottom: 56px;
    line-height: 1.2;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 28px 28px 24px;
    width: 100%;
    max-width: 480px;
    box-shadow: 8px 8px 20px rgba(0,0,0,0.08), -6px -6px 16px rgba(255,255,255,0.95), inset 0 0 0 1px rgba(255,255,255,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .card img {
    width: 100%;
    max-width: 380px;
    height: 280px;
    object-fit: contain;
    border-radius: 12px;
    background: transparent;
  }
  .card-caption {
    font-size: 24px;
    font-weight: 400;
    color: #1a1a1a;
    text-align: center;
    line-height: 1.3;
  }
  .btn-main {
    font-family: 'StratosSkyeng', 'Inter', sans-serif;
    background: #00C1FF;
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    min-width: 220px;
    font-size: 16px;
    font-weight: 400;
    cursor: pointer;
    box-shadow: 4px 4px 12px rgba(0,193,255,0.22), -2px -2px 8px rgba(255,255,255,0.8);
    transition: transform 0.12s;
    margin-top: 4px;
  }
  .btn-main:hover { transform: translateY(-2px); }
  .btn-main:active { transform: scale(0.97); }
  .btn-back {
    font-family: 'StratosSkyeng', 'Inter', sans-serif;
    background: #ffffff;
    color: #00C1FF;
    border: 2px solid #00C1FF;
    border-radius: 14px;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 400;
    cursor: pointer;
    box-shadow: 4px 4px 12px rgba(0,0,0,0.06);
    transition: transform 0.12s;
    margin-top: 28px;
  }
  .btn-back:hover { transform: translateY(-2px); }
  .loading-dots { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 20px 0 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #00C1FF; animation: bounce 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
  .loading-text { font-size: 15px; color: #aaa; text-align: center; }
  .question-icon { font-size: 64px; margin-bottom: 0; text-align: center; }
  #screen-start, #screen-card, #screen-final { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 480px; }
  #screen-start { gap: 36px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="screen-start">
  <img class="question-icon" src="first_screen.png" alt="Нарисуй красивый дом" />
  <button class="btn-main" onclick="showCard(0)">Нарисуй красивый дом</button>
</div>

<div id="screen-card" class="hidden">
  <div class="card">
    <img id="card-img" src="" alt="house" />
    <div class="card-caption" id="card-caption"></div>
  </div>
  <button class="btn-main" id="btn-next" style="margin-top:24px;">Нарисуй ещё</button>
</div>

<div id="screen-final" class="hidden">
  <div class="card">
    <div class="card-caption" style="font-size:20px;color:#555;font-weight:400;">Продолжаю искать идеальный дом...</div>
    <div class="loading-dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="loading-text">Это может занять некоторое время</div>
  </div>
  <button class="btn-back" onclick="goBack()">← Вернуться в начало</button>
</div>

<script>
var cards = [
  { img: 'house_old.png', caption: 'Такой подойдет?' },
  { img: 'tent.png', caption: 'А этот достаточно красив?' },
  { img: 'villa.png', caption: 'И этот не подходит?' },
  { img: 'haunted_house.png', caption: 'И даже этот не подошел?' },
  { img: 'apartment_block.png', caption: 'Или такой?' }
];

function showCard(index) {
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-card').classList.add('hidden');
  document.getElementById('screen-final').classList.add('hidden');
  if (index >= cards.length) {
    document.getElementById('screen-final').classList.remove('hidden');
    return;
  }
  document.getElementById('card-img').src = cards[index].img;
  document.getElementById('card-caption').textContent = cards[index].caption;
  document.getElementById('btn-next').onclick = function() { showCard(index + 1); };
  document.getElementById('screen-card').classList.remove('hidden');
}

function goBack() {
  document.getElementById('screen-final').classList.add('hidden');
  document.getElementById('screen-card').classList.add('hidden');
  document.getElementById('screen-start').classList.remove('hidden');
}
</script>
</body>
</html>
