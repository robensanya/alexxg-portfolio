<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Первичное обучение команды продаж | Александра Гуляева</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; color: #221f21; font: 500 1rem/1.35 system-ui, sans-serif }
    header { display: flex; align-items: center; justify-content: space-between; gap: .5rem 1rem; flex-wrap: wrap; padding: .65rem clamp(.7rem, 3vw, 2rem); border-bottom: 1px solid #ddd }
    a { color: inherit }
    nav { display: flex; gap: .2rem; padding: .2rem; background: #f1efec; border-radius: .8rem }
    nav a { display: grid; place-items: center; padding: .55rem .8rem; border-radius: .6rem; text-decoration: none; text-align: center; font-size: .9rem }
    [aria-current] { background: #282425; color: white }
    iframe { flex: 1; min-height: 0; width: 100%; border: 0 }
  </style>
</head>
<body>
  <header>
    <a href="../../index.html#sales-onboarding">← В портфолио</a>
    <nav aria-label="Модули курса">
      <a href="#needs" aria-current="page">Выявление потребности</a>
      <a href="#objections">Работа с возражениями</a>
    </nav>
  </header>
  <iframe title="Выявление потребности" allowfullscreen></iframe>
  <script>
    const links = [...document.querySelectorAll('nav a')];
    const frame = document.querySelector('iframe');
    function showModule() {
      const selected = links.find(link => link.hash === location.hash) || links[0];
      for (const link of links) {
        if (link === selected) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      }
      frame.title = selected.textContent;
      frame.src = selected.hash.slice(1) + '/index.html';
    }
    window.addEventListener('hashchange', showModule);
    showModule();
  </script>
</body>
</html>
