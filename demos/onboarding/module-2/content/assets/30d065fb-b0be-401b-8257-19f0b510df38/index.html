<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта офиса</title>
<style>
  .office-map-wrap {
    font-family: 'StratosSkyeng', 'Stratos Skyeng', 'Onest', 'Segoe UI', sans-serif;
    max-width: 820px;
    margin: 0 auto;
    padding: 1rem 0;
    color: #101010;
    box-sizing: border-box;
  }

  .office-map-wrap * {
    box-sizing: border-box;
  }

  .office-map-tabs {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }

  .office-map-tab {
    appearance: none;
    border: 1.5px solid #101010;
    background: #ffffff;
    color: #101010;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 800;
    letter-spacing: -0.01em;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }

  .office-map-tab:hover {
    transform: translateY(-1px);
  }

  .office-map-tab.active {
    background: #101010;
    color: #ffffff;
  }

  .office-map-stage {
    position: relative;
    background: #000000;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,0.12);
  }

  .office-map-slide {
    display: none;
  }

  .office-map-slide.active {
    display: block;
  }

  .office-map-slide img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 28px;
    cursor: zoom-in;
    transition: filter 0.15s ease;
  }

  .office-map-slide img:hover {
    filter: brightness(1.04);
  }

  .office-map-overlay-title {
    position: absolute;
    top: 22px;
    right: 26px;
    z-index: 2;
    background: #d0ff99;
    color: #101010;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: -0.01em;
    padding: 8px 18px;
    border-radius: 999px;
    pointer-events: none;
  }

  .office-map-zoom-hint {
    text-align: center;
    font-size: 12px;
    color: #5f6470;
    margin-top: 10px;
    letter-spacing: -0.01em;
  }

  .office-map-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }

  .office-map-lightbox.open {
    display: flex;
  }

  .office-map-lightbox-stage {
    position: relative;
    width: 92vw;
    height: 88vh;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y;
  }

  .office-map-lightbox-stage img {
    display: block;
    max-width: none;
    transform-origin: top left;
    border-radius: 12px;
  }

  .office-map-lightbox-controls {
    position: absolute;
    top: 18px;
    right: 18px;
    display: flex;
    gap: 10px;
    z-index: 2;
  }

  .office-map-lightbox-btn {
    appearance: none;
    border: 1.5px solid #ffffff;
    background: rgba(255,255,255,0.08);
    color: #ffffff;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .office-map-lightbox-btn:hover {
    background: rgba(255,255,255,0.18);
  }

  .office-map-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 16px;
  }

  .office-map-arrow {
    appearance: none;
    border: 1.5px solid #101010;
    background: #ffffff;
    color: #101010;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .office-map-arrow:hover {
    transform: scale(1.05);
  }

  .office-map-arrow svg {
    width: 18px;
    height: 18px;
    stroke: #101010;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .office-map-counter {
    font-size: 13.5px;
    font-weight: 700;
    color: #5f6470;
    min-width: 70px;
    text-align: center;
  }

  @media (max-width: 540px) {
    .office-map-tab { font-size: 13px; padding: 8px 14px; }
    .office-map-stage { border-radius: 20px; }
    .office-map-slide img { border-radius: 20px; }
  }
</style>
</head>
<body>

<div class="office-map-wrap">

  <div class="office-map-tabs">
    <button class="office-map-tab active" data-idx="0" onclick="officeMapGo(0)">Все этажи</button>
    <button class="office-map-tab" data-idx="1" onclick="officeMapGo(1)">−1 этаж</button>
    <button class="office-map-tab" data-idx="2" onclick="officeMapGo(2)">1 этаж</button>
    <button class="office-map-tab" data-idx="3" onclick="officeMapGo(3)">2 этаж</button>
  </div>

  <div class="office-map-stage">
    <div class="office-map-slide active" data-idx="0">
      <span class="office-map-overlay-title">Карта офиса целиком</span>
      <img src="assets/overview.png" alt="Все этажи" onclick="officeMapZoom('assets/overview.png', 'Все этажи')">
    </div>
    <div class="office-map-slide" data-idx="1">
      <img src="assets/floor-minus1-crop.png" alt="−1 этаж" onclick="officeMapZoom('assets/floor-minus1-crop.png', '−1 этаж')">
    </div>
    <div class="office-map-slide" data-idx="2">
      <img src="assets/floor-1-crop.png" alt="1 этаж" onclick="officeMapZoom('assets/floor-1-crop.png', '1 этаж')">
    </div>
    <div class="office-map-slide" data-idx="3">
      <img src="assets/floor-2.png" alt="2 этаж" onclick="officeMapZoom('assets/floor-2.png', '2 этаж')">
    </div>
  </div>

  <p class="office-map-zoom-hint">Нажми на карту, чтобы увеличить</p>

  <div class="office-map-nav">
    <button class="office-map-arrow" onclick="officeMapPrev()" aria-label="Предыдущий этаж">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <span class="office-map-counter" id="officeMapCounter">1 / 4</span>
    <button class="office-map-arrow" onclick="officeMapNext()" aria-label="Следующий этаж">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

</div>

<div class="office-map-lightbox" id="officeMapLightbox">
  <div class="office-map-lightbox-controls">
    <button class="office-map-lightbox-btn" onclick="officeMapZoomStep(0.25)" aria-label="Приблизить">+</button>
    <button class="office-map-lightbox-btn" onclick="officeMapZoomStep(-0.25)" aria-label="Отдалить">−</button>
    <button class="office-map-lightbox-btn" onclick="officeMapCloseZoom()" aria-label="Закрыть">✕</button>
  </div>
  <div class="office-map-lightbox-stage" id="officeMapLightboxStage">
    <img id="officeMapLightboxImg" src="" alt="">
  </div>
</div>

<script>
  var officeMapTotal = 4;
  var officeMapCurrent = 0;

  function officeMapGo(idx) {
    officeMapCurrent = idx;
    document.querySelectorAll('.office-map-tab').forEach(function(btn) {
      btn.classList.toggle('active', parseInt(btn.dataset.idx, 10) === idx);
    });
    document.querySelectorAll('.office-map-slide').forEach(function(slide) {
      slide.classList.toggle('active', parseInt(slide.dataset.idx, 10) === idx);
    });
    document.getElementById('officeMapCounter').textContent = (idx + 1) + ' / ' + officeMapTotal;
  }

  function officeMapNext() {
    officeMapGo((officeMapCurrent + 1) % officeMapTotal);
  }

  function officeMapPrev() {
    officeMapGo((officeMapCurrent - 1 + officeMapTotal) % officeMapTotal);
  }

  // Lightbox zoom logic
  var officeMapZoomLevel = 1;
  var officeMapLightbox = document.getElementById('officeMapLightbox');
  var officeMapLightboxImg = document.getElementById('officeMapLightboxImg');
  var officeMapLightboxStage = document.getElementById('officeMapLightboxStage');

  function officeMapZoom(src, label) {
    officeMapLightboxImg.src = src;
    officeMapLightboxImg.alt = label;
    officeMapZoomLevel = 1.4;
    officeMapLightboxImg.style.transform = 'scale(' + officeMapZoomLevel + ')';
    officeMapLightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function officeMapCloseZoom() {
    officeMapLightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function officeMapZoomStep(delta) {
    officeMapZoomLevel = Math.min(4, Math.max(0.5, officeMapZoomLevel + delta));
    officeMapLightboxImg.style.transform = 'scale(' + officeMapZoomLevel + ')';
  }

  officeMapLightbox.addEventListener('click', function(e) {
    if (e.target === officeMapLightbox) {
      officeMapCloseZoom();
    }
  });

  // Drag to pan on desktop
  var officeMapDragging = false;
  var officeMapStartX = 0, officeMapStartY = 0, officeMapScrollLeft = 0, officeMapScrollTop = 0;

  officeMapLightboxStage.addEventListener('mousedown', function(e) {
    officeMapDragging = true;
    officeMapStartX = e.pageX;
    officeMapStartY = e.pageY;
    officeMapScrollLeft = officeMapLightboxStage.scrollLeft;
    officeMapScrollTop = officeMapLightboxStage.scrollTop;
  });

  window.addEventListener('mouseup', function() {
    officeMapDragging = false;
  });

  officeMapLightboxStage.addEventListener('mousemove', function(e) {
    if (!officeMapDragging) return;
    e.preventDefault();
    officeMapLightboxStage.scrollLeft = officeMapScrollLeft - (e.pageX - officeMapStartX);
    officeMapLightboxStage.scrollTop = officeMapScrollTop - (e.pageY - officeMapStartY);
  });
</script>

</body>
</html>
