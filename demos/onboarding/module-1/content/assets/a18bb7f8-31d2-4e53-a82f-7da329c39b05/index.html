<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Посмотреть шире</title>
<style>
  :root {
    --outer-bg: #f7f7f7;
    --page: #f7f7f7;
    --paper: #ffffff;
    --text: #101010;
    --muted: #5f6470;
    --stroke: #111111;
    --lime: #C7FF00;
    --pink: #ffc9f2;
    --lavender: #e8ddff;
    --yellow: #fff3a8;
    --sky: #d8f7ff;
    --orange: #ffcc8a;
    --r-lg: 34px;
    --r-md: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body, button {
    font-family: 'StratosSkyeng', 'Stratos Skyeng', 'Onest', 'Segoe UI', sans-serif;
  }

  body {
    min-height: 100vh;
    background: var(--outer-bg);
    font-family: 'StratosSkyeng', 'Stratos Skyeng', 'Onest', 'Segoe UI', sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 28px 16px 60px;
  }

  .task-wrap {
    width: 100%;
    max-width: 780px;
  }

  .task-card {
    background: #f7f7f7;
    border-radius: var(--r-lg);
    overflow: hidden;
    box-shadow: none;
    position: relative;
    min-height: 660px;
  }

  .task-card::before {
    content: '✦';
    position: absolute;
    left: 44px;
    top: 62px;
    font-size: 54px;
    line-height: 1;
    color: rgba(199,255,0,.98);
    text-shadow:
      96px 26px 0 rgba(199,255,0,.82),
      560px 72px 0 rgba(199,255,0,.76),
      626px 218px 0 rgba(199,255,0,.88),
      114px 410px 0 rgba(199,255,0,.64);
    pointer-events: none;
  }

  .task-card::after {
    content: '✶';
    position: absolute;
    right: 82px;
    top: 86px;
    font-size: 34px;
    line-height: 1;
    color: rgba(199,255,0,.92);
    text-shadow:
      -72px 150px 0 rgba(199,255,0,.68),
      -515px 214px 0 rgba(199,255,0,.78),
      -390px 510px 0 rgba(199,255,0,.7);
    pointer-events: none;
  }

  .case-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding: 7px 14px;
    border-radius: 999px;
    color: var(--text);
    background: rgba(255,255,255,.72);
    border: 1.5px solid var(--stroke);
    white-space: nowrap;
    position: relative;
    z-index: 2;
  }

  .title {
    max-width: 680px;
    margin-top: 18px;
    font-size: clamp(38px, 6.5vw, 68px);
    font-weight: 900;
    line-height: .88;
    letter-spacing: -0.035em;
    text-transform: uppercase;
    position: relative;
    z-index: 2;
  }

  .subtitle-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
    position: relative;
    z-index: 3;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 8px 13px;
    border-radius: 999px;
    background: #fff;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: -0.02em;
    border: 1.5px solid rgba(17,17,17,.9);
  }

  .chip:nth-child(2) { background: var(--pink); transform: rotate(-3deg); }
  .chip:nth-child(3) { background: var(--lime); transform: rotate(2deg); }

  .stage-panel {
    min-height: 118px;
    margin: 58px 34px 0;
    background: #ffffff;
    border-radius: 28px;
    padding: 22px 28px;
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    transform: none;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .28s ease, transform .28s ease, background .28s ease;
  }

  .stage-panel.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  .stage-number {
    display: none;
  }

  .stage-text {
    max-width: 620px;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 500;
    line-height: 1.08;
    letter-spacing: -0.015em;
    text-transform: none;
    text-align: center;
    white-space: pre-line;
  }

  .person-zone {
    min-height: 470px;
    padding: 40px 34px 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    position: relative;
    z-index: 3;
  }

  .person-halo {
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    width: min(480px, 86%);
    height: 250px;
    background: var(--lavender);
    border-radius: 45% 55% 48% 52% / 55% 43% 57% 45%;
    filter: blur(.2px);
    opacity: .95;
  }

  .person-img {
    width: min(645px, 138%);
    max-height: 735px;
    object-fit: contain;
    position: relative;
    z-index: 2;
    transform-origin: center bottom;
    transition: opacity .24s ease, transform .24s ease;
  }

  .person-img.is-changing {
    opacity: 0;
    transform: translateY(8px) scale(.985);
  }

  .action-area {
    padding: 0 34px 34px;
    margin-top: -4px;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 6;
  }

  .main-btn {
    width: 100%;
    max-width: 360px;
    min-height: 64px;
    border: none;
    border-radius: 999px;
    background: var(--text);
    color: #fff;
    font-family: 'StratosSkyeng', 'Stratos Skyeng', 'Onest', sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform .18s ease, background .18s ease;
    position: relative;
    overflow: hidden;
  }

  .main-btn::after {
    content: '↗';
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: var(--text);
    font-size: 20px;
    font-weight: 900;
  }

  .main-btn:hover {
    background: #333;
    transform: translateY(-2px);
  }

  .hint {
    position: absolute;
    left: 34px;
    bottom: 36px;
    max-width: 180px;
    padding: 12px 14px;
    background: var(--yellow);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.12;
    transform: rotate(-3deg);
    z-index: 4;
  }

  @media (max-width: 720px) {
    body { padding: 18px 10px 40px; }
    .task-wrap { max-width: 430px; }
    .task-card { border-radius: 28px; min-height: 640px; }
    .task-card::before { left: 20px; top: 38px; font-size: 42px; text-shadow: 86px 28px 0 rgba(199,255,0,.82), 318px 80px 0 rgba(199,255,0,.78), 40px 390px 0 rgba(199,255,0,.7); }
    .task-card::after { right: 34px; top: 50px; font-size: 28px; text-shadow: -70px 135px 0 rgba(199,255,0,.68), -285px 240px 0 rgba(199,255,0,.78); }
    .stage-panel { margin: 42px 16px 0; padding: 20px 18px; min-height: 116px; border-radius: 24px; transform: none; }
    .stage-number { display: none; }
    .stage-text { font-size: 22px; line-height: 1.08; text-align: center; }
    .person-zone { min-height: 430px; padding: 34px 16px 0; }
    .person-halo { height: 210px; bottom: 28px; }
    .person-img { width: min(585px, 144%); max-height: 675px; }
    .action-area { padding: 0 16px 28px; margin-top: -2px; }
    .main-btn { max-width: none; min-height: 60px; font-size: 20px; font-weight: 600; }
    .hint { position: static; margin: 0 16px 6px; max-width: none; transform: rotate(-1.5deg); }
  }
</style>
</head>
<body>
  <main class="task-wrap">
    <section class="task-card" aria-label="Интерактивное задание Посмотреть шире">
      <div class="stage-panel is-visible" id="stagePanel" aria-live="polite">
        <div class="stage-number" id="stageNumber">0</div>
        <div class="stage-text" id="stageText">Сделаю, как сказали.<br>Главное — закрыть задачу.</div>
      </div>

      <div class="hint">Нажимай на кнопку и расширяй рамку вопроса.</div>

      <div class="person-zone">
        <div class="person-halo" aria-hidden="true"></div>
        <img class="person-img" id="personImg" src="./images/4.png" alt="Сотрудник стоит с руками в карманах">
      </div>

      <div class="action-area">
        <button class="main-btn" id="mainBtn" type="button">Посмотреть шире!</button>
      </div>
    </section>
  </main>

<script>
  const stages = [
    {
      image: './images/1.png',
      text: 'На какой стратегический фокус это может работать?',
      number: '1',
      alt: 'Сотрудник задумчиво смотрит вверх'
    },
    {
      image: './images/2.png',
      text: 'Как это связано с целями команды?',
      number: '2',
      alt: 'Сотрудник разводит руками и смотрит вперед'
    },
    {
      image: './images/3.png',
      text: 'Что изменится для клиента, продукта или процесса, если задача будет сделана хорошо?',
      number: '3',
      alt: 'Сотрудник смотрит вперед через сложенные пальцы'
    }
  ];

  const startImage = {
    image: './images/4.png',
    text: 'Сделаю, как сказали.\nГлавное — закрыть задачу.',
    number: '0',
    alt: 'Сотрудник стоит с руками в карманах'
  };

  let currentStage = -1;

  const panel = document.getElementById('stagePanel');
  const stageNumber = document.getElementById('stageNumber');
  const stageText = document.getElementById('stageText');
  const personImg = document.getElementById('personImg');
  const mainBtn = document.getElementById('mainBtn');

  function showStage(index) {
    const stage = stages[index];
    personImg.classList.add('is-changing');

    setTimeout(() => {
      personImg.src = stage.image;
      personImg.alt = stage.alt;
      stageNumber.textContent = stage.number;
      stageText.textContent = stage.text;
      panel.classList.add('is-visible');
      personImg.classList.remove('is-changing');
    }, 180);
  }

  function resetTask() {
    personImg.classList.add('is-changing');

    setTimeout(() => {
      currentStage = -1;
      personImg.src = startImage.image;
      personImg.alt = startImage.alt;
      stageNumber.textContent = startImage.number;
      stageText.textContent = startImage.text;
      panel.classList.add('is-visible');
      personImg.classList.remove('is-changing');
    }, 180);
  }

  mainBtn.addEventListener('click', () => {
    if (currentStage >= stages.length - 1) {
      resetTask();
      return;
    }

    currentStage += 1;
    showStage(currentStage);
  });
</script>
</body>
</html>
