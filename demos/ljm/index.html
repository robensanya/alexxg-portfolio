<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LJM — Skyeng / путь руководителя</title>
<style>
  :root {
    --font: 'StratosSkyeng', 'Stratos Skyeng', sans-serif;
    --brand: #00C1FF;
    --brand-soft: rgba(0, 193, 255, .12);
    --brand-mid: rgba(0, 193, 255, .22);
    --bg: #f5f7f9;
    --paper: #ffffff;
    --ink: #111318;
    --muted: #666d78;
    --soft: #f2f5f7;
    --line: rgba(17, 19, 24, .06);
    --line-strong: rgba(17, 19, 24, .10);
    --chip: #eef1f4;
    --shadow: 0 10px 30px rgba(17, 19, 24, .05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font) !important; }

  body {
    background: transparent;
    color: var(--ink);
    padding: 18px;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.45;
  }

  .ejm-shell {
    max-width: 980px;
    margin: 0 auto;
    min-height: 250px;
    border: none;
    background: var(--paper);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: min-height .34s cubic-bezier(.4,0,.2,1);
  }

  .ejm-shell.has-active {
    min-height: 620px;
  }

  .ejm-topbar {
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 18px 18px 6px;
    border-bottom: none;
    background: #fff;
  }

  .search-box { position: relative; }

  .search-ico {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--muted);
  }

  .ejm-search {
    width: 100%;
    border: none;
    background: var(--chip);
    border-radius: 999px;
    padding: 16px 18px 16px 46px;
    font-size: 16px;
    font-weight: 400;
    color: var(--ink);
    outline: none;
    transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }

  .ejm-search::placeholder {
    color: #818891;
    font-weight: 400;
  }

  .ejm-search:focus {
    box-shadow: 0 0 0 3px rgba(0,193,255,.28);
    background: #fff;
  }

  .clear-btn {
    display: none;
    border: none;
    background: var(--chip);
    color: var(--ink);
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }

  .clear-btn:hover {
    transform: translateY(-1px);
    background: #e4e9ee;
  }

  .clear-btn.visible { display: inline-flex; }

  .stage-rail {
    display: flex;
    gap: 10px;
    padding: 26px 18px 22px;
    background: transparent;
    border-bottom: none;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    transition: padding .28s cubic-bezier(.4,0,.2,1), gap .28s cubic-bezier(.4,0,.2,1), border-color .2s ease;
  }

  .stage-rail::-webkit-scrollbar {
    display: none;
  }

  .stage-rail.has-active {
    gap: 8px;
    padding: 14px 18px 6px;
    border-bottom: none;
  }

  .stage-tab {
    flex: 1 0 148px;
    min-width: 130px;
    min-height: 102px;
    border: none;
    background: var(--soft);
    border-radius: 18px;
    padding: 24px 14px;
    cursor: pointer;
    display: grid;
    grid-template-columns: 36px minmax(0,1fr);
    gap: 10px;
    align-items: center;
    text-align: left;
    color: var(--ink);
    transition: background .18s ease, color .18s ease, border-radius .24s ease, transform .18s ease, opacity .18s ease, box-shadow .18s ease, padding .24s ease, min-height .24s ease;
  }

  .stage-rail.has-active .stage-tab {
    min-height: 56px;
    padding: 13px 12px 15px;
  }

  .stage-tab:hover:not(.active) {
    transform: translateY(-2px);
    background: #e9f7fd;
    box-shadow: 0 8px 18px rgba(17,19,24,.05);
  }

  .stage-tab.dimmed { opacity: .38; filter: grayscale(1); }
  .stage-tab.match { opacity: 1; filter: none; }

  .stage-tab.active {
    position: relative;
    z-index: 2;
    background: var(--brand);
    color: #fff;
    border-radius: 18px;
    box-shadow: 0 10px 24px rgba(0,193,255,.25);
  }

  .stage-num {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    border: none;
    background: var(--brand);
    color: #fff;
  }

  .stage-tab.active .stage-num {
    background: rgba(255,255,255,.92);
    color: var(--brand);
  }

  .stage-copy { min-width: 0; }

  .stage-name {
    display: block;
    font-size: 16px;
    line-height: 1.18;
    font-weight: 500;
    letter-spacing: -.015em;
  }

  .content {
    padding: 26px;
    background: #fff;
  }



  .content.is-empty { display: none; }

  .stage-panel { display: none; animation: fadeIn .22s ease both; }
  .stage-panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stage-head {
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: minmax(0,1fr);
    gap: 8px;
  }

  .stage-kicker {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: .01em;
  }

  .stage-title {
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.04;
    font-weight: 600;
    letter-spacing: -.035em;
  }

  .stage-title mark {
    color: var(--brand);
    background: none;
    border-radius: 0;
    padding: 0;
  }

  .stage-desc {
    max-width: 640px;
    color: #3f4650;
    font-size: 16px;
    line-height: 1.55;
    font-weight: 400;
  }

  .task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .task {
    background: var(--soft);
    border: none;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: none;
    transition: background .18s ease, box-shadow .18s ease, transform .18s ease;
  }

  .task.hidden { display:none; }

  .task.open {
    background: #fff;
    box-shadow: 0 14px 34px rgba(17,19,24,.10);
  }

  .task-head {
    display: grid;
    grid-template-columns: 44px minmax(0,1fr) 36px;
    gap: 14px;
    align-items: center;
    padding: 16px;
    cursor: pointer;
  }

  .task-icon {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .task-name {
    display: block;
    font-size: 16px;
    line-height: 1.25;
    font-weight: 500;
    letter-spacing: -.015em;
  }

  .task-route {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-top: 7px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
  }

  .task-route span + span::before {
    content: '→';
    margin-right: 10px;
    color: var(--brand);
    opacity: .95;
  }

  .task-toggle {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    background: var(--brand-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s ease, background .16s ease;
  }

  .task.open .task-icon { background: var(--brand-soft); }

  .task.open .task-toggle { background: var(--brand); transform: rotate(180deg); }

  .task.open .task-toggle svg { stroke: #fff; }

  .task-toggle svg {
    width: 17px;
    height: 17px;
    stroke: #05536b;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .task-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s cubic-bezier(.4,0,.2,1);
  }

  .task-body-inner {
    margin: 0 16px 16px;
    border-radius: 16px;
    background: var(--soft);
    border: none;
    padding: 16px;
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: 16px;
    align-items: center;
  }

  .route-label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .route-value {
    font-size: 16px;
    line-height: 1.35;
    font-weight: 400;
    letter-spacing: -.01em;
  }

  .task-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 18px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease, background .15s ease;
    border: none;
    background: var(--chip);
    color: var(--ink);
    white-space: nowrap;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(17,19,24,.10);
  }

  .btn.primary { background: var(--brand); color: #fff; }

  .btn.bot {
    background: rgba(255,255,255,.2);
    color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
  }

  .btn.bot:hover {
    background: rgba(255,255,255,.3);
  }

  .btn.disabled { opacity: .45; pointer-events: none; }



  .task-note {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
    font-weight: 400;
  }

  .extra-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .btn.secondary {
    background: var(--chip);
    color: var(--ink);
  }

  .support-card {
    margin-top: 18px;
    border: none;
    background: linear-gradient(120deg, #00C1FF, #0091DB);
    border-radius: 18px;
    padding: 18px;
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: 16px;
    align-items: center;
  }

  .support-title {
    font-size: 16px;
    line-height: 1.3;
    font-weight: 600;
    color: #fff;
    letter-spacing: -.01em;
  }

  .support-desc {
    margin-top: 4px;
    color: rgba(255,255,255,.85);
    font-size: 13px;
    line-height: 1.35;
    font-weight: 400;
  }

  .empty-state {
    display: none;
    border: none;
    background: var(--soft);
    border-radius: 18px;
    padding: 24px;
    font-size: 16px;
    font-weight: 400;
    color: var(--muted);
    text-align: center;
  }

  .empty-state.visible { display:block; }

  @media (max-width: 760px) {
    body { padding: 10px; }
    .ejm-shell { border-radius: 24px; }
    .ejm-topbar { grid-template-columns: 1fr; padding: 12px; }
    .clear-btn.visible { display:flex; justify-content:center; }
    .stage-rail {
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 18px 12px 16px;
      gap: 10px;
    }
    .stage-rail::-webkit-scrollbar { display: none; }
    .stage-rail.has-active {
      padding: 10px 12px 0;
      gap: 8px;
    }
    .stage-tab { flex-basis: 190px; min-width: 190px; }
    .stage-tab:hover:not(.active) { transform: translateY(-1px); }
    .content { padding: 18px; }
    .task-body-inner { grid-template-columns: 1fr; }
    .task-actions { justify-content: stretch; }
    .btn { flex: 1; }
    .support-card { grid-template-columns: 1fr; }
  }

  /* ── MJM special stage styles (Home design) ───── */

  .learn-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--brand-soft);
    border: none;
    border-radius: 18px;
    padding: 18px 24px;
    text-decoration: none;
    color: var(--ink);
    margin-bottom: 16px;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }

  .learn-banner:hover {
    transform: translateY(-2px);
    background: rgba(0,193,255,.18);
    box-shadow: 0 10px 28px rgba(0,193,255,.14);
  }

  .learn-label {
    font-size: 11px;
    font-weight: 600;
    color: #05536b;
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-bottom: 5px;
  }

  .learn-title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.025em;
    color: var(--ink);
    line-height: 1.2;
  }

  .learn-arrow {
    font-size: 26px;
    color: var(--brand);
    flex-shrink: 0;
    line-height: 1;
  }

  .mjm-steps {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .mjm-step {
    display: grid;
    grid-template-columns: 44px minmax(0,1fr);
    gap: 14px;
    align-items: flex-start;
    background: var(--soft);
    border: none;
    border-radius: 18px;
    padding: 16px;
    box-shadow: none;
  }

  .step-badge {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    background: var(--brand);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .step-title {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -.015em;
    line-height: 1.25;
    margin-bottom: 10px;
  }

  .step-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .s-chip {
    display: inline-flex;
    align-items: center;
    padding: 6px 13px;
    border-radius: 999px;
    background: #fff;
    border: none;
    font-size: 12.5px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: -.01em;
    color: var(--ink);
  }

  .s-chip:nth-child(odd) { background: rgba(0,193,255,.12); color: #05536b; }

  @media (max-width: 760px) {
    .learn-banner { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>

const BOT_LINK = '#';
let activeStage = null;
let openTasks = {};
let searchValue = '';

const colorVars = {
  lime:     ['#00C1FF','rgba(0,193,255,.12)'],
  sky:      ['#00C1FF','rgba(0,193,255,.12)'],
  lavender: ['#00C1FF','rgba(0,193,255,.12)'],
  pink:     ['#00C1FF','rgba(0,193,255,.12)'],
  yellow:   ['#00C1FF','rgba(0,193,255,.12)']
};

function norm(v) { return (v || '').toString().toLowerCase().trim(); }
function taskText(t) { return norm([t.name, t.category, t.tool, t.where, t.keywords].join(' ')); }
function stageMatches(stage, q) {
  if (stage.special) return true; // MJM stage is always visible
  return !q || stage.tasks.some(t => taskText(t).includes(q));
}
function filteredTasks(stage) {
  if (stage.special) return [];
  const q = norm(searchValue);
  return stage.tasks.map((t, idx) => ({ t, idx, match: !q || taskText(t).includes(q) })).filter(x => x.match);
}

function setAccent(el, color) {
  const [accent, soft] = colorVars[color] || colorVars.lime;
  el.style.setProperty('--accent', accent);
  el.style.setProperty('--accent-soft', soft);
}

function buildRail() {
  const rail = document.getElementById('stageRail');
  const q = norm(searchValue);
  rail.classList.toggle('has-active', activeStage !== null && activeStage !== undefined);
  rail.innerHTML = '';
  STAGES.forEach((s, i) => {
    const match = stageMatches(s, q);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'stage-tab'
      + (i === activeStage ? ' active' : '')
      + (q && match ? ' match' : '')
      + (q && !match ? ' dimmed' : '');
    btn.dataset.color = s.color;
    btn.innerHTML = `
      <span class="stage-num">${String(s.num).padStart(2,'0')}</span>
      <span class="stage-copy">
        <span class="stage-name">${s.short}</span>
      </span>`;
    btn.addEventListener('click', () => { activeStage = i; render(); });
    rail.appendChild(btn);
  });
}

function buildMjmPanel(s, panel) {
  const stepsHtml = s.mjmSteps.map(step => `
    <div class="mjm-step">
      <div class="step-badge">${step.num}</div>
      <div>
        <div class="step-title">${step.title}</div>
        <div class="step-chips">
          ${step.tools.map(t => `<span class="s-chip">${t}</span>`).join('')}
        </div>
      </div>
    </div>
  `).join('');

  panel.innerHTML = `
    <div class="stage-head">
      <div class="stage-kicker">02 / путь руководителя</div>
      <h2 class="stage-title">${s.titlePlain} <mark>${s.titleHl}</mark></h2>
      <p class="stage-desc">${s.desc}</p>
    </div>
    <div class="support-card" style="margin-top:0; margin-bottom:16px;">
      <div>
        <div class="support-title">Разобраться в рабочих процессах руководителя тебе поможет программа Регулярный менеджмент</div>
      </div>
      <a class="btn primary" href="${s.learnLink}" target="_blank" rel="noopener">Открыть программу ↗</a>
    </div>
    <div class="mjm-steps">${stepsHtml}</div>
    <div class="support-card">
      <div>
        <div class="support-title">Нужна помощь на любом этапе?</div>
        <div class="support-desc">Бот подскажет, куда идти и что делать.</div>
      </div>
      <a class="btn bot" href="${BOT_LINK}" target="_blank" rel="noopener">Открыть бота ↗</a>
    </div>
  `;
}

function buildContent() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  if (activeStage === null || activeStage === undefined) {
    content.classList.add('is-empty');
    return;
  }
  content.classList.remove('is-empty');
  STAGES.forEach((s, i) => {
    const panel = document.createElement('section');
    panel.className = 'stage-panel' + (i === activeStage ? ' active' : '');
    setAccent(panel, s.color);

    if (s.special === 'mjm') {
      buildMjmPanel(s, panel);
      content.appendChild(panel);
      return;
    }

    const tasks = filteredTasks(s);
    let taskHtml = tasks.map((x) => {
      const t = x.t;
      const key = `${i}-${x.idx}`;
      const isOpen = !!openTasks[key];
      const toolBtn = (!t.noToolBtn && t.link && t.link !== '#')
        ? `<a class="btn primary" href="${t.link}" target="_blank" rel="noopener">Открыть инструмент ↗</a>`
        : (!t.noToolBtn ? `<span class="btn primary disabled">Нет прямой ссылки</span>` : '');
      const extraLinks = Array.isArray(t.extraLinks) && t.extraLinks.length
        ? `<div class="extra-links">${t.extraLinks.map(link => `<a class="btn primary" href="${link.url}" target="_blank" rel="noopener">${link.label}</a>`).join('')}</div>`
        : '';
      return `
        <article class="task ${isOpen ? 'open' : ''}" id="task-${key}">
          <div class="task-head" onclick="toggleTask('${key}')">
            <span class="task-icon">${t.icon}</span>
            <span>
              <span class="task-name">${t.name}</span>
              <span class="task-route"><span>${t.category}</span><span>${t.tool}</span></span>
            </span>
            <span class="task-toggle" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></span>
          </div>
          <div class="task-body" id="body-${key}">
            <div class="task-body-inner">
              <div>
                <span class="route-label">Куда идти</span>
                <div class="route-value">${t.where}</div>
                ${extraLinks}
              </div>
              <div class="task-actions">
                ${toolBtn}
              </div>
            </div>
          </div>
        </article>`;
    }).join('');

    const learnCard = s.learnLink
      ? `<div class="support-card" style="margin-bottom:16px;">
          <div>
            <div class="support-title">Разобраться в рабочих процессах руководителя тебе поможет программа Регулярный менеджмент</div>
          </div>
          <a class="btn primary" href="${s.learnLink}" target="_blank" rel="noopener">Открыть программу ↗</a>
        </div>`
      : '';

    panel.innerHTML = `
      <div class="stage-head">
        <div class="stage-kicker">${String(s.num).padStart(2,'0')} / путь руководителя</div>
        <h2 class="stage-title">${s.titlePlain} <mark>${s.titleHl}</mark></h2>
        <p class="stage-desc">${s.desc}</p>
      </div>
      ${learnCard}
      <div class="task-list">${taskHtml}</div>
      <div class="empty-state ${tasks.length ? '' : 'visible'}">В этой вкладке совпадений нет. Попробуй другой запрос или посмотри подсвеченные этапы слева.</div>
      <div class="support-card">
        <div>
          <div class="support-title">Если возникли вопросы — обращайся к боту</div>
          <div class="support-desc">Он поможет сориентироваться, куда идти и что выбрать.</div>
        </div>
        <a class="btn bot" href="${BOT_LINK}" target="_blank" rel="noopener">Открыть бота ↗</a>
      </div>
    `;
    content.appendChild(panel);
  });
  requestAnimationFrame(syncOpenHeights);
}

function syncOpenHeights() {
  document.querySelectorAll('.task-body').forEach(el => {
    const key = el.id.replace('body-','');
    el.style.maxHeight = openTasks[key] ? el.scrollHeight + 'px' : '0';
  });
}

function toggleTask(key) {
  openTasks[key] = !openTasks[key];
  const task = document.getElementById('task-' + key);
  const body = document.getElementById('body-' + key);
  if (!task || !body) return;
  task.classList.toggle('open', openTasks[key]);
  body.style.maxHeight = openTasks[key] ? body.scrollHeight + 'px' : '0';
}

function chooseFirstMatchingStage() {
  const q = norm(searchValue);
  if (!q) return;
  const idx = STAGES.findIndex(s => !s.special && stageMatches(s, q));
  activeStage = idx !== -1 ? idx : null;
}

function updateShellState() {
  const shell = document.querySelector('.ejm-shell');
  shell.classList.toggle('has-active', activeStage !== null && activeStage !== undefined);
}

function render() { updateShellState(); buildRail(); buildContent(); }

const input = document.getElementById('searchInput');
const clear = document.getElementById('clearBtn');
input.addEventListener('input', () => {
  searchValue = input.value;
  openTasks = {};
  chooseFirstMatchingStage();
  clear.classList.toggle('visible', !!norm(searchValue));
  render();
});
clear.addEventListener('click', () => {
  input.value = '';
  searchValue = '';
  activeStage = null;
  openTasks = {};
  clear.classList.remove('visible');
  render();
  input.focus();
});

render();
</script>
